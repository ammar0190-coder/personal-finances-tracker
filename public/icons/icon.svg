<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Personal Finance Tracker">
  <rect width="512" height="512" rx="112" fill="#2a78d6"/>
  <!-- Three ascending bars: the app is about seeing money over time, and a
       bar motif stays legible at 192px where a currency glyph does not. -->
  <g fill="#ffffff">
    <rect x="128" y="280" width="68" height="84"  rx="34" fill-opacity="0.55"/>
    <rect x="222" y="224" width="68" height="140" rx="34" fill-opacity="0.78"/>
    <rect x="316" y="148" width="68" height="216" rx="34"/>
  </g>
</svg>
